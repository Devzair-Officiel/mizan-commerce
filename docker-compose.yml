# Supervision de développement, bibliothèque standard seulement : aucun paquet ajouté.
# Arrêt gracieux du worker avant chaque relance, y compris à l'arrêt du conteneur.
x-celery-dev-command: &celery-dev-command
  - python
  - -u
  - -c
  - |
    import os, signal, subprocess, time
    from pathlib import Path
    worker = None
    stopping = False
    def stop(*_):
        global stopping
        stopping = True
    def shutdown():
        if worker is not None and worker.poll() is None:
            worker.terminate()
            try:
                worker.wait(timeout=25)
            except subprocess.TimeoutExpired:
                worker.kill()
                worker.wait()
    def files():
        return {str(p): p.stat().st_mtime_ns for root in ('apps', 'config')
                for p in Path(root).rglob('*.py') if p.is_file()}
    signal.signal(signal.SIGTERM, stop)
    signal.signal(signal.SIGINT, stop)
    try:
        while not stopping:
            stamp = files()
            worker = subprocess.Popen(['celery', '-A', 'config', 'worker', '--loglevel=info',
                                       '--queues=' + os.environ['CELERY_DEV_QUEUE'], '--concurrency=1'])
            while not stopping and worker.poll() is None and files() == stamp:
                time.sleep(1)
            shutdown()
            if not stopping:
                print('Code Python modifié ou worker arrêté : redémarrage Celery', flush=True)
                time.sleep(1)
    finally:
        shutdown()

services:

  postgres:
    image: postgres:16                          # image officielle PostgreSQL version 16
    restart: unless-stopped                     # redémarre automatiquement sauf si arrêté manuellement
    env_file: .env                              # charge les variables depuis le fichier .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}               # nom de la base de données
      POSTGRES_USER: ${POSTGRES_USER}           # utilisateur PostgreSQL
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # mot de passe PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data  # persiste les données même si le conteneur est supprimé
    ports:
      - "5432:5432"                             # expose le port PostgreSQL sur la machine hôte

  redis:
    image: redis:7-alpine                       # image Redis légère (alpine = image minimale)
    restart: unless-stopped
    ports:
      - "6379:6379"                             # expose le port Redis sur la machine hôte

  backend:
    build:
      context: ./apps/backend
      target: development                       # utilise le stage "development" du Dockerfile multi-stage
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"   # utilisateur hôte : migrations, __pycache__ et fichiers générés lui appartiennent
    env_file: .env
    environment:
      - HOME=/tmp                               # l'uid hôte n'a pas de dossier personnel dans l'image
      - PYTEST_XDIST_AUTO_NUM_WORKERS=4         # `pytest -n auto` : 4 workers en local au lieu de 16 (cœurs logiques, psutil absent) ; plus : `-n 8`
      - EXPORTS_RENDER_RATE=${EXPORTS_RENDER_RATE:-1000/minute}  # rendus PDF/WhatsApp des exports : 10/minute par défaut (base.py) ; relevé pour que les audits ne dépendent pas de la minute
    volumes:
      - ./apps/backend:/app                     # monte le code local dans le conteneur (hot reload)
    ports:
      - "8000:8000"                             # expose l'API Django sur le port 8000
    depends_on:
      - postgres                                # attend que postgres démarre avant de lancer le backend
      - redis

  celery-default:
    build:
      context: ./apps/backend
      target: development
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file: .env
    environment:
      - HOME=/tmp
      - CELERY_DEV_QUEUE=celery
    volumes:
      - ./apps/backend:/app
    command: *celery-dev-command
    stop_grace_period: 35s
    depends_on:
      - postgres
      - redis

  celery-ocr:
    build:
      context: ./apps/backend
      target: development                       # même image que backend pour partager le code monté
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"   # comme backend : aucun fichier root dans le code monté
    env_file: .env
    environment:
      - HOME=/tmp
      - CELERY_DEV_QUEUE=ocr
    volumes:
      - ./apps/backend:/app                     # hot reload : le code OCR est modifié en dev
    command: *celery-dev-command
    stop_grace_period: 35s
    depends_on:
      - postgres
      - redis

  ai-service:
    build:
      context: ./apps/ai-service            # service FastAPI séparé (V6 : OCR/IA)
      target: development                   # code monté, rechargement à chaud
    restart: unless-stopped
    env_file: .env                          # transmet AI_SERVICE_API_KEY (jamais commité)
    # Reste en root : PaddleOCR écrit dans son cache (/root/.paddlex, volume existant en root).
    # Il n'écrit donc rien dans le code monté : ni __pycache__ ni cache pytest.
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTEST_ADDOPTS=-p no:cacheprovider
    volumes:
      - ./apps/ai-service:/app              # hot reload en dev (uvicorn --reload)
      - paddle_models:/root/.paddlex        # cache modèles PaddleOCR (évite un ~50 Mo de retéléchargement à chaque rebuild)
    ports:
      - "127.0.0.1:8001:8000"               # localhost uniquement pour tests manuels (curl)
    # Aucune dépendance à postgres/redis : ce service ne touche pas à la DB.

  frontend:
    build:
      context: ./apps/frontend
      target: development                       # utilise le stage "development" du Dockerfile multi-stage
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"   # utilisateur hôte (HOST_UID/HOST_GID, 1000 par défaut) : pas de fichier root dans le code
    volumes:
      - ./apps/frontend:/app                    # monte le code local dans le conteneur (hot reload)
      - /app/node_modules                       # empêche le volume hôte d'écraser les node_modules du conteneur
    environment:
      - API_URL=http://backend:8000/api          # serveur→serveur (réseau Docker interne)
    ports:
      - "3000:3000"                             # expose Next.js sur le port 3000
    depends_on:
      - backend

  e2e:
    image: mcr.microsoft.com/playwright:v1.62.1-noble   # image officielle : Chromium + dépendances, Node inclus
    profiles: ["audit"]                         # ne démarre pas avec la stack : `docker compose run --rm e2e`
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"   # node_modules créés au nom de l'utilisateur hôte
    working_dir: /e2e
    ipc: host                                   # recommandé par Playwright pour Chromium
    init: true                                  # processus 1 minimal : signaux transmis, processus orphelins récupérés
    mem_limit: ${AUDIT_MEM_LIMIT:-3g}           # au-delà, Chromium est arrêté dans le conteneur au lieu de saturer la machine (à ajuster selon les mesures)
    memswap_limit: ${AUDIT_MEMSWAP_LIMIT:-${AUDIT_MEM_LIMIT:-3g}}   # mémoire + swap : égal à mem_limit, le conteneur ne swappe pas
    environment:
      - HOME=/tmp                               # cache npm accessible à l'utilisateur hôte
      - NPM_CONFIG_UPDATE_NOTIFIER=false
      - BASE_URL=http://frontend:3000           # frontend du réseau compose
      - AUDIT_MATRIX=${AUDIT_MATRIX:-smoke}     # smoke : 1440 fr clair + 360 ar sombre ; full : les 8 configurations
      - AUDIT_JOBS=${AUDIT_JOBS:-1}             # audits lancés en même temps (une boutique d'audit chacun) ; à passer en préfixe (`AUDIT_JOBS=2 docker compose run …`) pour qu'e2e-reset crée autant de boutiques
    volumes:
      - ./apps/frontend/e2e:/e2e
      - ./apps/frontend/messages:/messages:ro   # textes attendus (fr/en/ar)
    entrypoint: ["sh", "-c", "npm ci --no-audit --no-fund --loglevel=error && exec \"$$@\"", "--"]
    command: ["npm", "run", "audit"]
    depends_on:
      frontend:
        condition: service_started
      e2e-reset:
        condition: service_completed_successfully   # boutique d'audit remise à zéro avant chaque lancement (`run --no-deps` pour garder les données)

  e2e-reset:
    build:
      context: ./apps/backend
      target: development                       # même image que backend, code monté
    profiles: ["audit"]                         # lancé par `docker compose run --rm e2e`, puis s'arrête
    restart: "no"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file: .env
    environment:
      - HOME=/tmp
    volumes:
      - ./apps/backend:/app
    command: ["python", "manage.py", "reset_audit_shop", "--slots", "${AUDIT_JOBS:-1}"]   # une boutique par audit simultané ; DEBUG ou ALLOW_SEED=1 requis, comme seed_data
    depends_on:
      - postgres

volumes:
  postgres_data:                                # volume nommé géré par Docker pour persister les données PostgreSQL
  paddle_models:                                # cache modèles PaddleOCR (téléchargés au premier appel du pipeline)