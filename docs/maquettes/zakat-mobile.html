<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mizan — Zakat, mobile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
.mz{--bg:#FAF6EF;--card:#FFFDFA;--fg:#1D2A25;--muted:#F0EDE4;--mfg:#656E6B;--border:#E1DED4;--primary:#367762;--pfg:#FFFFFF;--soft:#DAEDE6;--softfg:#183A2F;--amber:#B45309;--amberbg:#FDF1DC;--red:#B91C1C;--redbg:#FBE7E4;--green:#2F7A3E;--greenbg:#E3F1E3;--bar:#C9DDD4;--scrim:rgba(29,42,37,.38);font-family:'Geist',ui-sans-serif,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;color:var(--fg)}
.mz.dark{--bg:#1A211E;--card:#252E2A;--fg:#EAE7E2;--muted:#2F3834;--mfg:#A6ADA9;--border:rgba(255,255,255,.10);--primary:#83C0AA;--pfg:#1A211E;--soft:#2F3B36;--softfg:#D3E8DF;--amber:#F2B95C;--amberbg:rgba(242,185,92,.13);--red:#F28B82;--redbg:rgba(242,139,130,.13);--green:#7BCB8A;--greenbg:rgba(123,203,138,.13);--bar:#3F5048;--scrim:rgba(0,0,0,.55)}
body{margin:0;background:#E9E6DE}
.mz *{box-sizing:border-box}
:where(.mz) button{font:inherit;color:inherit;cursor:pointer}
:where(.mz) a{color:inherit;text-decoration:none}
.mz :focus-visible{outline:2px solid var(--primary);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:16px;height:16px}

/* Pilotage */
.mq{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:#14201B;color:#EAE7E2;font:500 13px/1 'Geist',system-ui,sans-serif}
.mq b{font-weight:600}
.mq .sp{flex:1}
.mq button{height:30px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:transparent;color:inherit;font:inherit;cursor:pointer;white-space:nowrap}
.mq button[aria-pressed=true]{background:#EAE7E2;color:#14201B}

/* Planche */
.board{display:flex;gap:40px;padding:32px;overflow-x:auto;align-items:flex-start}
.mz.dark .board{background:#101614}
figure{margin:0;flex:none;width:390px}
figcaption{font:500 13px/1.45 'Geist',system-ui,sans-serif;color:#3B4641;margin-top:14px;max-width:390px}
.mz.dark figcaption{color:#A6ADA9}
figcaption b{display:block;font-weight:600;color:#1D2A25;margin-bottom:2px}
.mz.dark figcaption b{color:#EAE7E2}

/* Téléphone */
.phone{position:relative;width:390px;height:844px;border-radius:44px;background:var(--bg);overflow:hidden;box-shadow:0 0 0 10px #1D2A25,0 24px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:14px;font-weight:600}
.tb{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--bg)}
.tb .ic{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.tb .t{font-size:17px;font-weight:600}
.prog{flex:none;padding:0 16px 10px}
.prog .l{font-size:12.5px;font-weight:500;color:var(--mfg)}
.mz .pick{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0;border:0;background:none;font-size:12.5px;font-weight:600;color:var(--mfg)}
.sw{position:relative;display:inline-block;width:40px;height:24px;border-radius:999px;background:var(--bar);flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:999px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:inset-inline-start .15s}
.sw[aria-checked=true]{background:var(--primary)}
.sw[aria-checked=true]::after{inset-inline-start:19px}
.mz button.sw{border:0;padding:0}
.addgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mz .add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;padding:8px 4px;border-radius:14px;border:1px solid var(--border);background:var(--card);font-size:12px;font-weight:600;color:var(--fg);text-align:center;line-height:1.2}
.add svg.i{color:var(--primary)}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mfg)}
.ob{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.ob:last-child{border-bottom:0}
.ob .tx{flex:1;min-width:0}
.ob .t1{font-size:14px;font-weight:600}
.ob .t2{font-size:12px;color:var(--mfg);margin-top:2px}
.ob .am{font-size:14px;font-weight:600;white-space:nowrap}
.ob.off .t1,.ob.off .am{color:var(--mfg)}
.line .ed{color:var(--mfg);display:flex;align-items:center;justify-content:center;width:28px;height:28px}
.line.e{grid-template-columns:20px minmax(0,1fr) auto 28px}
.prog .bars{display:flex;gap:4px;margin-top:7px}
.prog .bars i{flex:1;height:4px;border-radius:99px;background:var(--muted)}
.prog .bars i.on{background:var(--primary)}
.scr{flex:1;overflow:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:14px}
.scr>*{flex-shrink:0}
.fab{flex:none;display:flex;gap:10px;align-items:center;padding:10px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);border-top:1px solid var(--border)}
.bn{flex:none;height:64px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:var(--card);border-top:1px solid var(--border);padding-bottom:8px}
.bn a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--mfg)}
.bn .sell{width:52px;height:52px;margin:-26px auto 0;border-radius:999px;background:var(--primary);color:var(--pfg);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--card)}

/* Éléments */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:999px;border:0;font-size:15px;font-weight:600;white-space:nowrap;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--primary);color:var(--pfg)}
.btn.w{flex:1}
.mini{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--border);background:var(--card);text-align:start}
.mini .k{font-size:11.5px;color:var(--mfg);display:flex;align-items:center;gap:4px}
.mini .v{font-size:15px;font-weight:700}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.band{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 16px;background:var(--muted);border-bottom:1px solid var(--border)}
.band h2{font-size:15px;font-weight:600;margin:0}
.band .hint{font-size:12px;color:color-mix(in srgb,var(--fg) 72%,var(--muted));margin-top:2px;line-height:1.4}
.band .act{font-size:13px;font-weight:600;color:var(--primary);white-space:nowrap;background:none;border:0;padding:0;min-height:24px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px}
.row:last-child{border-bottom:0}
.row .t1{font-weight:600}
.row .t2{font-size:12px;color:var(--mfg);margin-top:2px}
.num{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:end}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:11px;font-weight:600;color:var(--mfg);white-space:nowrap}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--greenbg);color:var(--green)}
.b-soft{background:var(--soft);color:var(--softfg)}
.b-neutral{background:var(--muted);color:var(--fg)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
h1{font-size:22px;font-weight:600;letter-spacing:-.015em;margin:4px 0 0}
.lead{font-size:13.5px;color:var(--mfg);line-height:1.45;margin-top:4px}
.why{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--primary);background:none;border:0;padding:0;min-height:44px}
.lnk{font-size:13px;font-weight:600;color:var(--primary);background:none;border:0;padding:0 4px;min-height:44px;white-space:nowrap}
.foot{font-size:12px;color:var(--mfg);line-height:1.5}

/* Accueil */
.hero{display:grid;grid-template-columns:116px 1fr;gap:16px;align-items:center;padding:18px 16px}
.ring{position:relative;width:116px;height:116px}
.ring svg{width:116px;height:116px;display:block}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .d{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1}
.ring .l{font-size:11px;color:var(--mfg);margin-top:2px;text-align:center;line-height:1.25}
.when .k{font-size:12px;font-weight:500;color:var(--mfg)}
.when .g{font-size:19px;font-weight:600;letter-spacing:-.015em;margin-top:4px;line-height:1.2}
.when .h{font-size:13.5px;color:var(--mfg);margin-top:3px}
.hfacts{border-top:1px solid var(--border)}

/* Choix */
.choice{display:flex;gap:12px;width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--border);background:var(--card);text-align:start}
.choice[aria-checked=true]{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 6%,var(--card))}
.radio{width:20px;height:20px;border-radius:999px;border:2px solid var(--border);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center}
.choice[aria-checked=true] .radio{border-color:var(--primary)}
.choice[aria-checked=true] .radio::after{content:"";width:10px;height:10px;border-radius:999px;background:var(--primary)}
.choice .ct{display:block;font-size:14.5px;font-weight:600}
.choice .cd{display:block;font-size:12.5px;color:var(--mfg);margin-top:2px;line-height:1.4}
.choice .tags{margin-top:8px}
.choice .am{display:block;font-size:13px;font-weight:600;margin-top:8px}
.kept{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--soft);color:var(--softfg)}
.kept .k{font-size:12px}
.kept .v{font-size:14px;font-weight:600;margin-top:2px}
.kept .act{font-size:13px;font-weight:600;background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:2px;min-height:44px}

/* Créances */
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:12px;background:var(--muted)}
.seg button{height:30px;padding:0 10px;border:0;border-radius:9px;background:transparent;font-size:12.5px;font-weight:600;color:var(--mfg);white-space:nowrap}
.seg button.sel{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(29,42,37,.15)}
.seg button.sel.dbt{color:var(--amber)}
.cr{padding:12px 16px;border-bottom:1px solid var(--border)}
.cr:last-child{border-bottom:0}
.cr .top{display:flex;justify-content:space-between;gap:12px}
.cr .ft{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}
.cr .ft .n{font-size:12px;color:var(--mfg)}
.addline{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:999px;border:1.5px dashed var(--border);background:transparent;color:var(--primary);font-size:14px;font-weight:600;width:100%}
.tot{display:flex;justify-content:space-between;font-size:13.5px;padding:10px 16px;background:color-mix(in srgb,var(--muted) 55%,var(--card))}

/* Résultat */
.res{padding:20px 18px;background:var(--soft);color:var(--softfg);border-radius:18px}
.res .k{font-size:13px;font-weight:500}
.res .v{font-size:44px;font-weight:700;letter-spacing:-.035em;line-height:1;margin-top:8px}
.res .v.zero{font-size:24px;letter-spacing:-.02em;line-height:1.2}
.res .l{font-size:13.5px;margin-top:10px;line-height:1.45}
.res .m{font-size:12px;margin-top:6px;opacity:.85;line-height:1.45}
.line{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--border);font-size:13.5px}
.line:last-child{border-bottom:0}
.line .op{font-weight:700;color:var(--mfg);text-align:center}
.line .lb{display:flex;flex-direction:column}
.line .lb small{font-size:11.5px;color:var(--mfg);margin-top:1px}
.line.eq{background:color-mix(in srgb,var(--muted) 55%,var(--card));font-weight:600}

/* Feuille du bas (Fondement) */
.sheetwrap{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;max-height:78%;background:var(--card);border-radius:22px 22px 0 0;display:flex;flex-direction:column}
.grab{width:40px;height:5px;border-radius:99px;background:var(--border);margin:10px auto 0}
.sheet .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 18px 12px;border-bottom:1px solid var(--border)}
.sheet .hd h3{font-size:17px;font-weight:600;margin:0}
.sheet .hd .s{font-size:12.5px;color:var(--mfg);margin-top:3px}
.sheet .x{width:44px;height:44px;margin:-8px -10px 0 0;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--mfg)}
.sheet .bd{overflow:auto;padding:0 18px 24px}
.blk{padding:14px 0;border-bottom:1px solid var(--border)}
.blk:last-child{border-bottom:0}
.blk h4{font-size:12.5px;font-weight:600;color:var(--mfg);margin:0 0 6px}
.blk p{margin:0;font-size:14px;line-height:1.55}
.src-item{padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--border)}
.src-item .q{font-size:13.5px;line-height:1.5}
.src-item .ref{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;margin-top:8px;font-size:12px;color:var(--mfg)}
.pos{padding:9px 0}
.pos+.pos{border-top:1px dashed var(--border)}
.pos .t{font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.pos .t span{font-size:11px;color:var(--primary);white-space:nowrap}
.pos .tags{margin-top:6px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<div class="mz" id="root">

<div class="mq" role="toolbar" aria-label="Pilotage de la maquette">
  <b>Zakat — mobile 390</b>
  <span class="sp"></span>
  <button id="below" aria-pressed="false">Résultat sous le seuil</button>
  <button id="theme" aria-pressed="false">Sombre</button>
</div>

<div class="board">

<!-- ═══════════════ M1. ACCUEIL ═══════════════ -->
<figure>
<div class="phone">
  <div class="status"><span>9:41</span><span>●●●</span></div>
  <div class="tb">
    <button class="ic" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <span class="t">Zakat</span>
  </div>
  <div class="scr">
    <div class="card">
      <div class="hero">
        <div class="ring" aria-label="128 jours avant le jour J">
          <svg viewBox="0 0 116 116" aria-hidden="true"><g transform="translate(58 58)">
            <circle r="48" fill="none" stroke="var(--bar)" stroke-width="8"/>
            <circle r="48" fill="none" stroke="var(--primary)" stroke-width="8" stroke-linecap="round" stroke-dasharray="192.8 301.6" transform="rotate(-90)"/>
            <g transform="rotate(230) translate(0 -48) rotate(-230)"><circle r="9" fill="var(--card)" stroke="var(--primary)" stroke-width="2"/><path d="M2.9-4.2A4.9 4.9 0 1 0 2.9 4.2 3.7 3.7 0 1 1 2.9-4.2z" fill="var(--primary)"/></g>
          </g></svg>
          <div class="c"><div class="d">128</div><div class="l">jours avant<br>le jour J</div></div>
        </div>
        <div class="when">
          <div class="k">Votre prochain jour J</div>
          <div class="g">Lundi 22 février 2027</div>
          <div class="h">15 ramadan 1448</div>
        </div>
      </div>
      <div class="hfacts">
        <div class="row"><div><div class="t1">Seuil : 1 428,00 €</div><div class="t2" style="color:var(--amber)">Prix du gramme saisi il y a 12 jours</div></div><button class="lnk">Mettre à jour</button></div>
        <div class="row"><div><div class="t1">Zakat 1447 : 496,75 €</div><div class="t2">Modifié le 5 mars 2026</div></div><a class="act" style="font-size:13px;font-weight:600;color:var(--primary)" href="#">PDF</a></div>
      </div>
    </div>

    <div class="card">
      <div class="band"><div><h2>Ce que Mizan connaît déjà</h2><div class="hint">Le jour J, il vous restera la trésorerie et les dettes.</div></div></div>
      <div class="row"><div><div class="t1">Stock à vendre</div><div class="t2">42 articles, au prix de vente</div></div><div class="num t1">18 420,00 €</div></div>
      <div class="row"><div><div class="t1">Vos clients vous doivent</div><div class="t2">6 commandes non réglées</div></div><div class="num t1">1 240,00 €</div></div>
    </div>

    <div class="card">
      <div class="band"><div><h2>Vos choix de calcul</h2><div class="hint">Là où les avis divergent, vous choisissez.</div></div><button class="act">Modifier</button></div>
      <div class="row"><span class="t2" style="margin:0">Seuil</span><span class="t1">Argent, 595 g</span></div>
      <div class="row"><span class="t2" style="margin:0">Année</span><span class="t1">Hégirienne, 2,5 %</span></div>
      <div class="row"><span class="t2" style="margin:0">Stock</span><span class="t1">Prix de vente</span></div>
      <div class="row"><span class="t2" style="margin:0">Créances sûres</span><span class="t1">Chaque année</span></div>
      <div class="row"><span class="t2" style="margin:0">Dettes</span><span class="t1">Dues dans 12 mois</span></div>
    </div>

    <div class="card">
      <div class="band"><div><h2>Historique</h2></div></div>
      <div class="row"><div><div class="t1">1447</div><div class="t2">4 mars 2026</div></div><div style="text-align:end"><div class="num t1">496,75 €</div><span class="badge b-soft" style="margin-top:4px">Au-dessus du seuil</span></div></div>
      <div class="row"><div><div class="t1">1446</div><div class="t2">15 mars 2025</div></div><div style="text-align:end"><div class="num t1">0,00 €</div><span class="badge b-neutral" style="margin-top:4px">Sous le seuil</span></div></div>
    </div>

    <p class="foot">Estimation fondée sur vos chiffres et vos choix d’avis. Ajoutez vos autres biens au calcul : argent personnel, autre commerce, immobilier, or.</p>
  </div>
  <div class="fab"><a class="btn p w" href="#"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Préparer ma zakat 1448</a></div>
  <nav class="bn" aria-label="Navigation principale">
    <a href="#"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</a>
    <a href="#"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/></svg>Clients</a>
    <a href="#" aria-label="Vendre"><span class="sell"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></a>
    <a href="#"><svg class="i" viewBox="0 0 24 24"><path d="M6 2h12l2 5H4z"/><path d="M4 7h16v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/></svg>Commandes</a>
    <a href="#"><svg class="i" viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/></svg>Catalogue</a>
  </nav>
</div>
<figcaption><b>1. Accueil /zakat</b>Le jour J au centre (date grégorienne et hégirienne). Une seule action, en bas, au pouce. Les choix d’avis toujours visibles.</figcaption>
</figure>

<!-- ═══════════════ M2. ÉTAPE CRÉANCES ═══════════════ -->
<figure>
<div class="phone">
  <div class="status"><span>9:41</span><span>●●●</span></div>

<script>
(function(){
  var root=document.getElementById('root');
  document.getElementById('theme').addEventListener('click',function(){var on=root.classList.toggle('dark');this.setAttribute('aria-pressed',String(on))});
  document.getElementById('below').addEventListener('click',function(){
    var on=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',String(on));
    document.querySelectorAll('[data-above]').forEach(function(n){n.hidden=on});document.querySelectorAll('[data-below]').forEach(function(n){n.hidden=!on});
  });
  document.querySelectorAll('[role=radiogroup]').forEach(function(g){
    g.querySelectorAll('[role=radio]').forEach(function(r){r.addEventListener('click',function(){
      g.querySelectorAll('[role=radio]').forEach(function(o){o.setAttribute('aria-checked','false')});r.setAttribute('aria-checked','true');
    })});
  });
  document.querySelectorAll('.sw').forEach(function(w){w.addEventListener('click',function(){var on=w.getAttribute('aria-checked')!=='true';w.setAttribute('aria-checked',String(on));w.closest('.ob').classList.toggle('off',!on)})});
  document.querySelectorAll('.seg').forEach(function(s){s.querySelectorAll('button').forEach(function(b,i){b.addEventListener('click',function(){
    s.querySelectorAll('button').forEach(function(o){o.classList.remove('sel','dbt')});b.classList.add('sel');if(i===1)b.classList.add('dbt');
  })})});
})();
</script>
