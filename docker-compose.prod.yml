services:

  postgres:
    image: postgres:16
    restart: always
    env_file: .env.prod
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    # Pas de port exposé : accessible uniquement en réseau Docker interne

  backend:
    build:
      context: ./apps/backend
      target: production
    container_name: mizan-commerce-backend
    restart: always
    env_file: .env.prod
    ports:
      - "127.0.0.1:8001:8000"   # localhost — pour SSH tunnel si besoin
    networks:
      - default                 # postgres, redis
      - web                     # Caddy (admin.mizan-commerce.com)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build:
      context: ./apps/backend
      target: production
    restart: always
    env_file: .env.prod
    command: celery -A config worker --loglevel=info --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery-ocr:
    build:
      context: ./apps/backend
      target: production
    restart: always
    env_file: .env.prod
    # Worker dédié à la queue OCR : isolé du worker généraliste pour ne pas
    # bloquer les tâches courtes derrière une reconnaissance longue.
    command: celery -A config worker --loglevel=info --queues=ocr --concurrency=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    build:
      context: ./apps/backend
      target: production
    restart: always
    env_file: .env.prod
    command: celery -A config beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./apps/frontend
      target: production
      args:
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
    container_name: mizan-commerce-frontend
    restart: always
    env_file: .env.prod
    networks:
      - default
      - web
    environment:
      - API_URL=http://backend:8000/api
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    depends_on:
      - backend

networks:
  web:
    external: true

volumes:
  postgres_data:
