services:

  postgres:
    image: postgres:16
    restart: always
    env_file: .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    # Pas de port exposé : accessible uniquement en réseau Docker interne

  backend:
    build:
      context: ./apps/backend
      target: production
    restart: always
    env_file: .env.prod
    ports:
      - "127.0.0.1:8001:8000"   # localhost uniquement — pour SSH tunnel si besoin d'admin Django
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build:
      context: ./apps/backend
      target: production
    restart: always
    env_file: .env.prod
    command: celery -A config worker --loglevel=info --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    build:
      context: ./apps/backend
      target: production
    restart: always
    env_file: .env.prod
    command: celery -A config beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./apps/frontend
      target: production
    restart: always
    networks:
      - default
      - proxy
    environment:
      - API_URL=http://backend:8000/api
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend

networks:
  proxy:
    external: true

volumes:
  postgres_data:
