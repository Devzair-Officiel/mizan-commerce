# Un environnement complet de Mizan : production ou staging, même fichier.
# Lancé par deploy/deploy.sh, qui fixe le nom de projet (mizan-<env>), le
# fichier de variables (deploy/env/<env>.env) et l'étiquette d'image :
#
#   docker compose -p mizan-production --env-file deploy/env/production.env \
#     -f deploy/app/compose.yml up -d
#
# Aucun port publié : Caddy (deploy/edge) joint frontend et backend par le
# réseau externe « edge ». Chaque service ne reçoit que ses propres variables.
#
# Réseau « edge » partagé par staging et production : Compose y inscrit aussi le
# NOM DU SERVICE (« backend », « frontend ») de chaque environnement. Un service
# qui rejoint edge ne joint donc un pair que par son alias unique
# mizan-<env>-<service>, ou par un nom absent d'edge (postgres, redis,
# ai-service : réseau privé du projet).
# Total des limites mémoire en production ≈ 6,1 Go sur 12 (staging : moins,
# réglé dans deploy/env/staging.env).
#
# PostgreSQL utilise l'image mizan-postgres:16 (deploy/postgres), construite sur
# le serveur par deploy.sh : archivage continu du journal et sauvegardes WAL-G
# (docs/exploitation/sauvegardes.md).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Isolation des services applicatifs (Django, frontend, ai-service, redis) :
# aucun gain de privilège à l'exécution (setuid, capacités de fichier) et aucune
# capacité Linux, inutiles à ces processus qui tournent sous un utilisateur non
# root. Chacun borne en plus son nombre de processus et de threads (pids_limit).
# PostgreSQL et backup n'en ont pas : docs/exploitation/deploiement.md
# (« Isolation des conteneurs »).
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Django : backend (gunicorn), workers Celery et Celery Beat. Même image.
x-django: &django
  <<: *hardening
  image: ghcr.io/devzair-officiel/mizan-backend:${IMAGE_TAG:?IMAGE_TAG manquant (deploy/deploy.sh)}
  restart: unless-stopped
  # Gunicorn (3 workers) ou Celery (2 processus) : quelques dizaines de threads.
  pids_limit: 256
  environment:
    SECRET_KEY: ${SECRET_KEY:?}
    # Domaines publics, plus l'alias interne qu'appelle le frontend (API_URL).
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?},mizan-${APP_ENV:?}-backend
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?}
    FRONTEND_URL: ${FRONTEND_URL:?}
    DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
    POSTGRES_DB: ${POSTGRES_DB:?}
    # Rôle de l'application, jamais le super-utilisateur (deploy/postgres/mizan-db-roles.sh).
    POSTGRES_USER: ${APP_DB_USER:?}
    POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
    EMAIL_HOST: ${EMAIL_HOST:?}
    EMAIL_PORT: ${EMAIL_PORT:-587}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?}
    RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
    RECAPTCHA_MIN_SCORE: ${RECAPTCHA_MIN_SCORE:-0.5}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    OVH_S3_ACCESS_KEY: ${OVH_S3_ACCESS_KEY:?}
    OVH_S3_SECRET_KEY: ${OVH_S3_SECRET_KEY:?}
    OVH_S3_ENDPOINT_URL: ${OVH_S3_ENDPOINT_URL:?}
    OVH_S3_REGION: ${OVH_S3_REGION:?}
    OVH_S3_BUCKET_PRIVATE: ${OVH_S3_BUCKET_PRIVATE:?}
    AI_SERVICE_URL: http://ai-service:8000
    AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?}
    AI_SERVICE_TIMEOUT_SECONDS: ${AI_SERVICE_TIMEOUT_SECONDS:-5}
    AI_SERVICE_OCR_TIMEOUT_SECONDS: ${AI_SERVICE_OCR_TIMEOUT_SECONDS:-180}
    AI_SERVICE_INVOICE_TIMEOUT_SECONDS: ${AI_SERVICE_INVOICE_TIMEOUT_SECONDS:-50}
    AI_SERVICE_PRODUCT_SCAN_TIMEOUT_SECONDS: ${AI_SERVICE_PRODUCT_SCAN_TIMEOUT_SECONDS:-40}
    # Même valeur qu'ai-service (lue ici et là-bas) : le backend en déduit si les
    # lectures avancées du scan d'emballage existent (plafond mensuel réservé,
    # jauge Abonnement affichée). `none` ici = ni réservation ni jauge, et
    # ai-service n'appelle pas le modèle texte (structure=false), quel que soit
    # son fournisseur.
    VISION_PROVIDER: ${VISION_PROVIDER:-none}
    SENTRY_DSN: ${SENTRY_DSN:-}
    SENTRY_ENVIRONMENT: ${APP_ENV:?}
    SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: *logging

# Image PostgreSQL avec WAL-G : base, planificateur des sauvegardes, restauration.
x-postgres-image: &postgres-image
  image: mizan-postgres:16
  build:
    context: ../postgres

# WAL-G : bucket de sauvegardes S3 dans une autre région que le serveur, un
# préfixe par environnement, chiffrement côté client (libsodium).
x-walg: &walg
  WALG_S3_PREFIX: s3://${BACKUP_S3_BUCKET:?}/${APP_ENV:?}
  AWS_ENDPOINT: ${BACKUP_S3_ENDPOINT_URL:?}
  AWS_REGION: ${BACKUP_S3_REGION:?}
  AWS_S3_FORCE_PATH_STYLE: "true"
  AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:?}
  AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:?}
  WALG_LIBSODIUM_KEY: ${BACKUP_ENCRYPTION_KEY:?}
  WALG_LIBSODIUM_KEY_TRANSFORM: hex
  WALG_COMPRESSION_METHOD: zstd
  # Une base neuve (volume vide, restauration) ne doit jamais écraser le journal
  # déjà archivé : WAL-G refuse alors d'envoyer un fichier qui existe.
  WALG_PREVENT_WAL_OVERWRITE: "true"

# Worker Celery joignable : ping par son nom (default@… ou ocr@…).
x-celery-healthcheck: &celery-healthcheck
  interval: 60s
  timeout: 20s
  start_period: 30s
  start_interval: 5s
  retries: 3

services:
  # Archivage continu : chaque segment du journal part dans le bucket de
  # sauvegardes, au plus 60 s après sa première écriture (perte maximale : 1 min).
  # Seuls postgres, backup et restore connaissent le super-utilisateur
  # (POSTGRES_USER) ; Django et Celery se connectent avec APP_DB_USER.
  postgres:
    <<: [*postgres-image, *hardening]
    restart: unless-stopped
    # Jamais root : l'entrypoint de l'image saute alors chown et gosu (volume
    # déjà à postgres). Lecture seule hors du volume de la base ; socket et
    # fichiers temporaires en mémoire. Processus : max_connections (100), ceux
    # de fond, wal-g et ses threads.
    user: postgres
    read_only: true
    tmpfs:
      - /var/run/postgresql:size=1m,uid=999,gid=999,mode=2775
      - /tmp:size=64m,mode=1777
    pids_limit: 300
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      - archive_timeout=60
    environment:
      <<: *walg
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      # Rôle de l'application, créé ou mis à jour par mizan-db-roles (deploy.sh).
      APP_DB_USER: ${APP_DB_USER:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    logging: *logging

  # Planificateur des sauvegardes (deploy/postgres/mizan-backup.sh) : sauvegarde
  # complète chaque nuit, suppression au-delà de la durée de conservation,
  # contrôle de l'archivage toutes les 5 min, test de restauration mensuel.
  # Lit les fichiers de la base en lecture seule.
  backup:
    <<: [*postgres-image, *hardening]
    restart: unless-stopped
    user: postgres
    # Écrit dans son volume de travail (instance du test de restauration) et
    # dans /tmp (sonde de santé, fichiers temporaires). Processus : wal-g et
    # l'instance PostgreSQL temporaire du test mensuel.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 128
    command: ["mizan-backup", "scheduler"]
    environment:
      <<: *walg
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      ARCHIVE_HEARTBEAT_URL: ${ARCHIVE_HEARTBEAT_URL:-}
      ARCHIVE_MAX_DELAY_MINUTES: ${ARCHIVE_MAX_DELAY_MINUTES:-5}
      RESTORE_TEST_DAY: ${RESTORE_TEST_DAY:-1}
      RESTORE_TEST_TIME: ${RESTORE_TEST_TIME:-04:00}
      RESTORE_TEST_HEARTBEAT_URL: ${RESTORE_TEST_HEARTBEAT_URL:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data:ro
      - backup-work:/var/lib/mizan-backup
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/mizan-backup.alive"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 5s
      retries: 3
    mem_limit: ${BACKUP_MEM_LIMIT:-512m}
    logging: *logging

  # Restauration dans un nouveau volume, sans jamais toucher la base en service :
  # lancé uniquement par deploy/backup/restore.sh (profil « restore »).
  restore:
    <<: *postgres-image
    profiles: [restore]
    user: postgres
    environment:
      <<: *walg
      PGUSER: ${POSTGRES_USER:?}
      PGDATABASE: ${POSTGRES_DB:?}
    shm_size: 256m
    logging: *logging

  # Broker Celery : mot de passe (fichier de configuration généré, jamais sur la
  # ligne de commande), persistance AOF, aucune éviction (une tâche ne se perd pas).
  redis:
    <<: *hardening
    image: redis:7-alpine
    restart: unless-stopped
    user: redis
    pids_limit: 64  # quelques threads, plus le processus de réécriture AOF
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-192mb}
    command:
      - sh
      - -c
      - |
        umask 077
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf --appendonly yes \
          --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    logging: *logging

  backend:
    <<: *django
    # Système de fichiers en lecture seule : le code ne peut pas être modifié.
    # /tmp : fichiers envoyés de plus de 2,5 Mo, le temps de la requête (Django).
    # Le battement des workers Gunicorn est dans /dev/shm (gunicorn.conf.py).
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"
      interval: 15s
      timeout: 10s
      start_period: 20s
      start_interval: 5s
      retries: 3
    mem_limit: ${BACKEND_MEM_LIMIT:-768m}
    networks:
      default:
      edge:
        aliases:
          - mizan-${APP_ENV:?}-backend

  celery-default:
    <<: *django
    command:
      - celery
      - -A
      - config
      - worker
      - --queues=celery
      - --hostname=default@%h
      - --concurrency=${CELERY_DEFAULT_CONCURRENCY:-2}
      - --loglevel=INFO
    healthcheck:
      <<: *celery-healthcheck
      test: ["CMD-SHELL", "celery -A config inspect ping -d \"default@$$HOSTNAME\" --timeout 10"]
    mem_limit: ${CELERY_DEFAULT_MEM_LIMIT:-512m}

  # File « ocr » : appels HTTP au service IA, un à la fois.
  celery-ocr:
    <<: *django
    command:
      - celery
      - -A
      - config
      - worker
      - --queues=ocr
      - --hostname=ocr@%h
      - --concurrency=1
      - --loglevel=INFO
    healthcheck:
      <<: *celery-healthcheck
      test: ["CMD-SHELL", "celery -A config inspect ping -d \"ocr@$$HOSTNAME\" --timeout 10"]
    mem_limit: ${CELERY_OCR_MEM_LIMIT:-384m}

  # Une seule instance par environnement (sinon les tâches planifiées partent en double).
  celery-beat:
    <<: *django
    command:
      - celery
      - -A
      - config
      - beat
      - --schedule=/tmp/celerybeat-schedule
      - --loglevel=INFO
    healthcheck:
      # Beat n'a pas de sonde propre : on vérifie qu'il joint le broker.
      test:
        - CMD
        - python
        - -c
        - "import os, redis; redis.Redis.from_url(os.environ['REDIS_URL'], socket_timeout=5).ping()"
      interval: 60s
      timeout: 10s
      retries: 3
    mem_limit: ${CELERY_BEAT_MEM_LIMIT:-192m}

  frontend:
    <<: *hardening
    image: ghcr.io/devzair-officiel/mizan-frontend:${IMAGE_TAG:?}
    restart: unless-stopped
    pids_limit: 256
    # Lecture seule, sauf le cache de Next.js (images redimensionnées par
    # next/image, réponses mises en cache), vidé à chaque redémarrage.
    read_only: true
    tmpfs:
      - /app/.next/cache:size=128m,mode=1777
      - /tmp:size=16m,mode=1777
    environment:
      # Alias unique sur edge : « backend » y désigne aussi l'autre environnement.
      API_URL: http://mizan-${APP_ENV:?}-backend:8000/api
      COOKIE_SECURE: "true"
      MAPTILER_API_KEY: ${MAPTILER_API_KEY:-}
      SENTRY_ENVIRONMENT: ${APP_ENV:?}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/favicon.ico"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      start_interval: 5s
      retries: 3
    mem_limit: ${FRONTEND_MEM_LIMIT:-512m}
    networks:
      default:
      edge:
        aliases:
          - mizan-${APP_ENV:?}-frontend
    logging: *logging

  ai-service:
    <<: *hardening
    image: ghcr.io/devzair-officiel/mizan-ai-service:${IMAGE_TAG:?}
    restart: unless-stopped
    # PaddleOCR crée un pool de threads OpenMP par cœur : marge plus large.
    pids_limit: 512
    environment:
      APP_ENV: ${APP_ENV:?}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_INVOICE_MODEL: ${OPENAI_INVOICE_MODEL:-gpt-5-mini}
      OPENAI_INVOICE_TIMEOUT_SECONDS: ${OPENAI_INVOICE_TIMEOUT_SECONDS:-45}
      # Scan d'emballage, deux niveaux (checklist de lancement : politique de
      # confidentialité revue avant d'activer l'un ou l'autre) :
      # - VISION_PROVIDER : fournisseur IA ; `none` = rien ne part ;
      #   sinon le texte lu (jamais l'image) part à la structuration ;
      # - PRODUCT_SCAN_IMAGE_FALLBACK : `true` autorise en plus l'envoi de la
      #   photo de face en secours.
      # Même valeur que le backend (ancre x-django), qui tient le plafond mensuel.
      VISION_PROVIDER: ${VISION_PROVIDER:-none}
      PRODUCT_TEXT_MODEL: ${PRODUCT_TEXT_MODEL:-}
      PRODUCT_TEXT_TIMEOUT_SECONDS: ${PRODUCT_TEXT_TIMEOUT_SECONDS:-15}
      PRODUCT_SCAN_IMAGE_FALLBACK: ${PRODUCT_SCAN_IMAGE_FALLBACK:-false}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_TIMEOUT_SECONDS: ${VISION_TIMEOUT_SECONDS:-30}
      PADDLE_OCR_CPU_THREADS: ${PADDLE_OCR_CPU_THREADS:-2}
    volumes:
      - ai-models:/home/app/.paddlex  # modèles PaddleOCR, téléchargés au premier appel
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 30s
      start_interval: 5s
      retries: 3
    mem_limit: ${AI_SERVICE_MEM_LIMIT:-2g}
    logging: *logging

networks:
  edge:
    name: edge
    external: true

volumes:
  # Base en service. POSTGRES_DATA_VOLUME : mise en service d'une base restaurée
  # par deploy/backup/restore.sh (docs/exploitation/sauvegardes.md).
  postgres-data:
    name: ${POSTGRES_DATA_VOLUME:-mizan-${APP_ENV:?}_postgres-data}
  backup-work:
  redis-data:
  ai-models:
