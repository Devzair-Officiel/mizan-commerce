# Entrée du serveur : Caddy, seul service qui publie des ports (80 et 443).
# Termine le HTTPS (certificats Let's Encrypt automatiques) et route chaque
# domaine vers son environnement par le réseau Docker externe « edge ».
#
#   docker network create edge        # une fois par serveur
#   docker compose -f deploy/edge/compose.yml up -d
#
# Variables : deploy/env/edge.env (modèle : deploy/env/edge.env.example).
# Procédure complète : docs/exploitation/deploiement.md.
name: mizan-edge

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    # Aucune capacité Linux sauf l'écoute des ports 80 et 443, aucun gain de
    # privilège à l'exécution, nombre de threads borné.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 256
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    env_file: ${EDGE_ENV_FILE:-../env/edge.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy-data:/data      # certificats et clés : à conserver (limites Let's Encrypt)
      - caddy-config:/config
    networks:
      - edge
    healthcheck:
      # API d'administration de Caddy, à l'écoute de localhost dans le conteneur seulement.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  edge:
    name: edge
    external: true

volumes:
  caddy-data:
  caddy-config:
