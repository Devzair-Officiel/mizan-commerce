# Intégration continue : backend, frontend et images Docker.
# Réglages GitHub (protection de main, jobs obligatoires) : docs/ci.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

# Un nouveau push annule l'exécution en cours de la même branche.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backend
    services:
      # Mêmes images que docker-compose.yml.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mizan
          POSTGRES_USER: mizan
          POSTGRES_PASSWORD: mizan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mizan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: mizan
      POSTGRES_USER: mizan
      POSTGRES_PASSWORD: mizan
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-not-for-production
      # Aucun secret : stockage OVH non configuré (is_storage_configured() faux),
      # les tests d'upload forcent leurs réglages et simulent boto3.
      OVH_S3_ACCESS_KEY: ""
      OVH_S3_SECRET_KEY: ""
      OVH_S3_ENDPOINT_URL: ""
      OVH_S3_BUCKET_PRIVATE: ""
      AI_SERVICE_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements/*.txt
      - name: Dépendances
        run: pip install -r requirements/local.txt
      - name: Ruff
        run: ruff check .
      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest -n auto

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"  # même version que l'image node:20-alpine du Dockerfile
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Dépendances
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Messages (fr/en/ar)
        run: npm run i18n:check
      - name: Couleurs via tokens
        run: npm run tokens:check
      - name: Aucun texte en dur
        run: npm run text:check
      - name: Dépendances uniques
        run: npm run deps:check
      - name: Build
        run: npm run build
        env:
          # Valeurs factices : le build n'appelle pas l'API.
          API_URL: http://localhost:8000/api
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ""

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Images de production, construites sans être publiées.
      - name: Image backend
        uses: docker/build-push-action@v7
        with:
          context: apps/backend
          target: production
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Image frontend
        uses: docker/build-push-action@v7
        with:
          context: apps/frontend
          target: production
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
