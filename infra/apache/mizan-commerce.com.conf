# ─── HTTP uniquement (provisoire — sans SSL) ──────────────────────────────────
# Une fois le certificat Let's Encrypt obtenu, remplacer par la version HTTPS.

<VirtualHost *:80>
    ServerName mizan-commerce.com
    ServerAlias www.mizan-commerce.com

    RequestHeader set X-Forwarded-Proto "http"

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    ErrorLog  ${APACHE_LOG_DIR}/mizan-commerce-error.log
    CustomLog ${APACHE_LOG_DIR}/mizan-commerce-access.log combined
</VirtualHost>

# ─── Version HTTPS à activer après certbot ────────────────────────────────────
# sudo systemctl stop apache2
# sudo certbot certonly --standalone -d mizan-commerce.com -d www.mizan-commerce.com
# → remplacer ce fichier par infra/apache/mizan-commerce.com.https.conf
# sudo systemctl start apache2 && sudo systemctl reload apache2
