# ─── Modules Apache requis ────────────────────────────────────────────────────
# sudo a2enmod proxy proxy_http ssl headers rewrite
# sudo systemctl restart apache2

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
<VirtualHost *:80>
    ServerName mizan-commerce.com
    ServerAlias www.mizan-commerce.com
    Redirect permanent / https://mizan-commerce.com/
</VirtualHost>

# ─── www → non-www (HTTPS) ────────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName www.mizan-commerce.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/mizan-commerce.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mizan-commerce.com/privkey.pem

    Redirect permanent / https://mizan-commerce.com/
</VirtualHost>

# ─── HTTPS principal ──────────────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName mizan-commerce.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/mizan-commerce.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mizan-commerce.com/privkey.pem

    # En-têtes de sécurité
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Indique à Django que le protocole original est HTTPS
    RequestHeader set X-Forwarded-Proto "https"

    # Proxy vers le conteneur Next.js (port 3001 sur localhost)
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    ErrorLog  ${APACHE_LOG_DIR}/mizan-commerce-error.log
    CustomLog ${APACHE_LOG_DIR}/mizan-commerce-access.log combined
</VirtualHost>

# ─── Notes de déploiement ─────────────────────────────────────────────────────
# 1. Copier ce fichier dans /etc/apache2/sites-available/mizan-commerce.com.conf
# 2. sudo a2ensite mizan-commerce.com
# 3. Obtenir le certificat SSL :
#    sudo certbot certonly --apache -d mizan-commerce.com -d www.mizan-commerce.com
# 4. sudo systemctl reload apache2
#
# Accès Django admin (si besoin) via SSH tunnel :
#    ssh -L 8001:127.0.0.1:8001 user@ton-serveur
#    puis ouvrir http://localhost:8001/admin/
